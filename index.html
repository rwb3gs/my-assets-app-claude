<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="theme-color" content="#0a0f1e"/>
  <title>家庭資產戰情室</title>
  <link rel="icon" type="image/png" href="icon.png"/>
  <link rel="manifest" href="manifest.json"/>

  <style>
    :root {
      --bg:      #0a0f1e;
      --surface: #111827;
      --border:  rgba(99,179,237,0.18);
      --gold:    #f6c90e;
      --blue:    #63b3ed;
      --green:   #48bb78;
      --text:    #e2e8f0;
      --muted:   #718096;
      --danger:  #fc8181;
    }

    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Helvetica Neue','PingFang TC','Microsoft JhengHei',sans-serif;
      color: var(--text);
    }

    /* ══════════════ LOCK SCREEN ══════════════ */
    #lock-screen {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    #lock-screen.hiding {
      opacity: 0;
      transform: scale(1.04);
      pointer-events: none;
    }

    #lock-screen::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(99,179,237,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,179,237,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridMove 20s linear infinite;
    }

    #lock-screen::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 30% 30%, rgba(99,179,237,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 75% 70%, rgba(246,201,14,0.05) 0%, transparent 60%);
      pointer-events: none;
    }

    @keyframes gridMove {
      0%   { background-position: 0 0; }
      100% { background-position: 40px 40px; }
    }

    .lock-card {
      position: relative;
      z-index: 1;
      width: min(340px, 90vw);
      background: rgba(17,24,39,0.9);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2.4rem 2rem;
      backdrop-filter: blur(20px);
      box-shadow:
        0 0 0 1px rgba(99,179,237,0.08),
        0 24px 60px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.06);
      animation: cardIn 0.8s cubic-bezier(0.16,1,0.3,1) both;
    }

    @keyframes cardIn {
      from { opacity:0; transform: translateY(32px) scale(0.96); }
      to   { opacity:1; transform: none; }
    }

    .lock-icon { text-align: center; margin-bottom: 0.6rem; }
    .lock-icon svg {
      width: 52px; height: 52px;
      filter: drop-shadow(0 0 12px rgba(246,201,14,0.4));
      animation: iconPulse 3s ease-in-out infinite;
    }

    @keyframes iconPulse {
      0%,100% { filter: drop-shadow(0 0 8px rgba(246,201,14,0.3)); }
      50%      { filter: drop-shadow(0 0 20px rgba(246,201,14,0.6)); }
    }

    .lock-title {
      text-align: center;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 0.3rem;
    }

    .lock-subtitle {
      text-align: center;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.12em;
      margin-bottom: 1.8rem;
    }

    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 1.6rem;
    }

    .pin-dot {
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 2px solid var(--muted);
      background: transparent;
      transition: all 0.2s ease;
    }

    .pin-dot.filled {
      background: var(--gold);
      border-color: var(--gold);
      box-shadow: 0 0 8px rgba(246,201,14,0.5);
      transform: scale(1.1);
    }

    .pin-dot.error {
      border-color: var(--danger);
      background: var(--danger);
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-6px); }
      40%      { transform: translateX(6px); }
      60%      { transform: translateX(-4px); }
      80%      { transform: translateX(4px); }
    }

    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .num-btn {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      color: var(--text);
      font-size: 1.3rem;
      font-weight: 300;
      padding: 1rem 0;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }

    .num-btn:active, .num-btn.pressed {
      background: rgba(99,179,237,0.12);
      border-color: rgba(99,179,237,0.3);
      transform: scale(0.94);
    }

    .num-btn.del-btn { font-size: 1rem; color: var(--muted); }
    .num-btn.empty-btn { background: transparent; border-color: transparent; cursor: default; }

    .error-msg {
      text-align: center;
      font-size: 0.75rem;
      color: var(--danger);
      margin-top: 1rem;
      height: 1rem;
      letter-spacing: 0.05em;
    }

    /* ══════════════ DASHBOARD ══════════════ */
    #dashboard {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      background: #000;
    }

    #dashboard.visible { display: flex; }

    /* fullscreen mode: hide top bar completely */
    #dashboard.fullscreen .top-bar { display: none; }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: rgba(10,15,30,0.95);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      height: 48px;
    }

    .top-bar-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--gold);
    }

    .top-bar-title svg { width: 18px; height: 18px; }

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.65rem;
      color: var(--green);
      letter-spacing: 0.1em;
    }

    .live-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%,100% { opacity:1; }
      50%      { opacity:0.3; }
    }

    .icon-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 0.75rem;
      padding: 4px 10px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .icon-btn:active { opacity: 0.6; transform: scale(0.95); }

    /* iframe */
    .iframe-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      height: 0; /* forces flex child to fill remaining space */
    }

    .iframe-wrap iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* loading */
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
      transition: opacity 0.5s ease;
    }

    .loading-overlay.hidden { opacity: 0; pointer-events: none; }

    .spinner {
      width: 36px; height: 36px;
      border: 2px solid rgba(99,179,237,0.15);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.15em;
    }

    /* floating lock button (shown in fullscreen) */
    #float-lock {
      position: fixed;
      bottom: 24px;
      right: 16px;
      z-index: 500;
      background: rgba(10,15,30,0.85);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 44px; height: 44px;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    #float-lock.visible { display: flex; }
  </style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lock-screen">
  <div class="lock-card">
    <div class="lock-icon">
      <svg viewBox="0 0 52 52" fill="none">
        <rect x="10" y="22" width="32" height="24" rx="6" fill="#1a2535" stroke="#f6c90e" stroke-width="1.5"/>
        <path d="M17 22V17a9 9 0 0 1 18 0v5" stroke="#f6c90e" stroke-width="2" stroke-linecap="round"/>
        <circle cx="26" cy="33" r="3.5" fill="#f6c90e"/>
        <line x1="26" y1="36" x2="26" y2="41" stroke="#f6c90e" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="lock-title">家庭資產戰情室</div>
    <div class="lock-subtitle">FAMILY ASSET COMMAND CENTER</div>

    <div class="pin-dots" id="pin-dots">
      <div class="pin-dot" id="d0"></div>
      <div class="pin-dot" id="d1"></div>
      <div class="pin-dot" id="d2"></div>
      <div class="pin-dot" id="d3"></div>
    </div>

    <div class="numpad">
      <button class="num-btn" data-n="1">1</button>
      <button class="num-btn" data-n="2">2</button>
      <button class="num-btn" data-n="3">3</button>
      <button class="num-btn" data-n="4">4</button>
      <button class="num-btn" data-n="5">5</button>
      <button class="num-btn" data-n="6">6</button>
      <button class="num-btn" data-n="7">7</button>
      <button class="num-btn" data-n="8">8</button>
      <button class="num-btn" data-n="9">9</button>
      <button class="num-btn empty-btn" disabled></button>
      <button class="num-btn" data-n="0">0</button>
      <button class="num-btn del-btn" id="del-btn">⌫</button>
    </div>

    <div class="error-msg" id="error-msg"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="top-bar">
    <div class="top-bar-title">
      <svg viewBox="0 0 18 18" fill="none">
        <rect x="1" y="9" width="4" height="8" rx="1" fill="#f6c90e"/>
        <rect x="7" y="5" width="4" height="12" rx="1" fill="#f6c90e" opacity="0.8"/>
        <rect x="13" y="1" width="4" height="16" rx="1" fill="#f6c90e" opacity="0.6"/>
      </svg>
      家庭資產戰情室
    </div>
    <div class="top-bar-right">
      <div class="live-badge"><div class="live-dot"></div>LIVE</div>
      <button class="icon-btn" id="fullscreen-btn">⛶ 全螢幕</button>
      <button class="icon-btn" id="lock-btn">🔒 鎖定</button>
    </div>
  </div>

  <div class="iframe-wrap">
    <div class="loading-overlay" id="loading">
      <div class="spinner"></div>
      <div class="loading-text">載入戰情室中...</div>
    </div>
    <iframe
      id="ds-frame"
      src="about:blank"
      allowfullscreen
      sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"
      title="家庭資產戰情室">
    </iframe>
  </div>
</div>

<!-- floating lock (fullscreen mode) -->
<button id="float-lock" title="鎖定">🔒</button>

<script>
  const CORRECT = '0125';
  const DS_URL  = 'https://datastudio.google.com/embed/reporting/a152befa-6590-4d9d-b58d-e2e1493b2c09/page/p_4qihgmd93d';

  let pin = '';
  const dots = [0,1,2,3].map(i => document.getElementById('d'+i));
  const errorMsg = document.getElementById('error-msg');
  const dashboard = document.getElementById('dashboard');
  const lockScreen = document.getElementById('lock-screen');
  const frame = document.getElementById('ds-frame');
  const loading = document.getElementById('loading');
  const floatLock = document.getElementById('float-lock');

  /* ── PIN logic ── */
  function updateDots() {
    dots.forEach((d,i) => { d.classList.toggle('filled', i < pin.length); d.classList.remove('error'); });
  }

  function triggerError() {
    dots.forEach(d => { d.classList.remove('filled'); d.classList.add('error'); });
    errorMsg.textContent = '密碼錯誤，請再試一次';
    setTimeout(() => {
      dots.forEach(d => d.classList.remove('error'));
      errorMsg.textContent = '';
      pin = ''; updateDots();
    }, 1000);
  }

  /* ── Fullscreen ── */
  function enterFullscreen() {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    dashboard.classList.add('fullscreen');
    floatLock.classList.add('visible');
  }

  function exitFullscreen() {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    dashboard.classList.remove('fullscreen');
    floatLock.classList.remove('visible');
  }

  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) {
      dashboard.classList.remove('fullscreen');
      floatLock.classList.remove('visible');
    }
  });

  /* ── Unlock ── */
  function unlock() {
    lockScreen.classList.add('hiding');
    setTimeout(() => {
      lockScreen.style.display = 'none';
      dashboard.classList.add('visible');
      frame.src = DS_URL;
      frame.onload = () => loading.classList.add('hidden');
      setTimeout(() => loading.classList.add('hidden'), 8000);
      // auto fullscreen on Android
      setTimeout(() => enterFullscreen(), 400);
    }, 600);
  }

  /* ── Lock ── */
  function lock() {
    exitFullscreen();
    pin = ''; updateDots();
    dashboard.classList.remove('visible');
    lockScreen.style.display = '';
    lockScreen.classList.remove('hiding');
    frame.src = 'about:blank';
    loading.classList.remove('hidden');
  }

  /* ── Input handlers ── */
  function handleInput(n) {
    if (pin.length >= 4) return;
    pin += n; updateDots();
    if (pin.length === 4) {
      setTimeout(() => { pin === CORRECT ? unlock() : triggerError(); }, 150);
    }
  }

  function handleDel() { pin = pin.slice(0,-1); updateDots(); errorMsg.textContent = ''; }

  document.querySelectorAll('.num-btn[data-n]').forEach(btn => {
    btn.addEventListener('click', () => {
      btn.classList.add('pressed');
      setTimeout(() => btn.classList.remove('pressed'), 150);
      handleInput(btn.dataset.n);
    });
  });

  document.getElementById('del-btn').addEventListener('click', handleDel);
  document.getElementById('lock-btn').addEventListener('click', lock);
  document.getElementById('fullscreen-btn').addEventListener('click', enterFullscreen);
  floatLock.addEventListener('click', lock);

  document.addEventListener('keydown', e => {
    if (lockScreen.style.display === 'none') return;
    if (e.key >= '0' && e.key <= '9') handleInput(e.key);
    if (e.key === 'Backspace') handleDel();
  });
</script>
</body>
</html>
